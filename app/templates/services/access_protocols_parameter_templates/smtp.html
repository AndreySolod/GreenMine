<table class="table table-stripped table-hovered">

        <th>{{ _("SMTP Commands") }}:</th>
    </tr>

        <td>{{ service.additional_attributes["smtp"]["commands"]|suppress_none }}</td>
    </tr>
    {% endif %}
</table>
