<table class="table table-stripped table-hovered">

        <th>{{ _("IMAP Capabilities") }}:</th>

        <td>{{ service.additional_attributes["imap"]["capabilities"]|suppress_none }}</td>
    </tr>
    {% endif %}
</table>
