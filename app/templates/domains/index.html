{% extends 'layout/base.html' %}
{% from 'layout/_macrosses.html' import bootstrap_table_icons %}

{% block page_content %}
<div class="row gutters">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <table class="table"    id="domains-table"
                                        data-search="true"
                                        data-show-columns="true"
                                        data-show-toggle="true"
                                        data-show-export="true"
                                        data-show-multi-sort="true"
                                        data-filter-control="true"
                                        data-buttons-class="primary"
                                        data-pagination="true"
                                        data-side-pagination="server"
                                        data-show-pagination-switch="true"
                                        data-page-list="[10, 25, 50, 100, 500, All]"
                                        data-url="{{ url_for('domains.domain_index_data', project_id=project.id) }}"
                                        data-cookie="true"
                                        data-cookie-id-table="DomainsIndex"
                                        data-cookie-storage="localStorage">
                </table>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}

{% block script %}
    {{ super() }}
    <script nonce="{{ csp_nonce() }}">
        $(function() {
            $('#domains-table').bootstrapTable({
                columns: [
                {
                    field: 'id',
                    title: '#',
                    align: 'center',
                    sortable: true,
                    filterControl: 'input'
                },
                {
                    field: 'title',
                    title: '{{ models.Domain.title.info["label"] }}',
                    align: 'center',
                    sortable: true,
                    filterControl: 'input',
                },
                {
                    field: 'created_at',
                    title: "{{ models.Domain.created_at.info['label'] }}",
                    align: 'center',
                    sortable: true,
                    filterControl: 'input'
                },
                {
                    field: "created_by.title-input",
                    title: "{{ models.Domain.created_by.info['label'] }}",
                    align: 'center',
                    sortable: true,
                    filterControl: 'input'
                },
                {
                    field: "updated_at",
                    title: "{{ models.Domain.updated_at.info['label'] }}",
                    align: 'center',
                    sortable: true,
                    filterControl: 'input'
                },
                {
                    field: "updated_by.title-input",
                    title: "{{ models.Domain.updated_by_id.info['label'] }}",
                    align: 'center',
                    sortable: true,
                    filterControl: 'input'
                },
                {
                    field: 'description',
                    title: '{{ models.ProjectTask.description.info["label"] }}',
                    align: 'center',
                    sortable: true,
                    filterControl: 'input',
                },
                ],
                icons: JSON.parse("{{ bootstrap_table_icons().strip() }}"),
                buttonsClass: 'primary',
                exportTypes: ['json', 'xml', 'png', 'csv', 'txt', 'sql', 'doc', 'excel', 'xlsx', 'pdf'],
                onDblClickRow: function(row, element, field) {
                    location = "{{ url_for('domains.domain_show', domain_id='__row_id') }}".replace("__row_id", row.id)
                },
                rowStyle: (value, row, index) => {
                    return { classes: "with-context-menu-domain", css: {"cursor": 'pointer', 'background-color': row.row_background_color} }
                }
            })
          });
        $(function () {
            $.contextMenu({
                selector: '.with-context-menu-domain',
                callback: function (key, options) {
                    if (key === 'open') {
                        window.open("{{ url_for('domains.domain_show', domain_id='__domain_id') }}".replace("__domain_id", options.$trigger.parent().parent().bootstrapTable('getData')[options.$trigger.data('index')].id), '_blank')
                    }
                    else if(key === 'edit') {
                        window.open("{{ url_for('domains.domain_edit', domain_id='__domain_id') }}".replace('__domain_id', options.$trigger.parent().parent().bootstrapTable('getData')[options.$trigger.data('index')].id), '_blank').focus()
                    }
                    else if (key === 'delete') {
                        if (confirm("{{ _('Are you sure you want to delete this domain?') }}")) {
                            let domain_id = options.$trigger.parent().parent().bootstrapTable('getData')[options.$trigger.data('index')].id;
                            fetch("{{ url_for('domains.domain_delete', domain_id='__domain_id') }}".replace('__domain_id', domain_id), {
                                method: 'POST',
                                headers: {
                                    'X-CSRFToken': '{{ csrf_token() }}'
                                }
                            }).then(response => {
                                if (response.redirected) {
                                    document.location = response.url;
                                }
                            });
                        };
                    }
                },
                items: {
                    "open": { name: '{{ _("Open in new tab") }}', icon: "filescroll" },
                    "edit": { name: '{{ _("Edit") }}' , icon: "edit"},
                    "delete": { name: '{{ _("Delete") }}' , icon: "delete"}
                }
            });
        });
      </script>
{% endblock %}
